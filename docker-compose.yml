version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chargeback_user
      POSTGRES_PASSWORD: demopassword123
      POSTGRES_DB: chargeback_db
    ports:
      - "5432:5432"
    volumes:
      - chargeback_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargeback_user -d chargeback_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://chargeback_user:demopassword123@db:5432/chargeback_db
      JWT_SECRET_KEY: 8f3Kx9vL2mQ7pR4tY6nW1sD5hG8jC0zA7pQ1mX
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  chargeback_pg_data:
